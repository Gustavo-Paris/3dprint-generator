services:
  postgres:
    image: postgres:16
    container_name: 3dgen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - 3dgen-pgdata:/var/lib/postgresql/data

  slicer:
    build:
      context: ./slicer
    platform: linux/amd64
    container_name: 3dgen-slicer
    restart: unless-stopped
    environment:
      QT_QPA_PLATFORM: offscreen
      PORT: "8787"
    ports:
      - "8787:8787"

volumes:
  3dgen-pgdata:
