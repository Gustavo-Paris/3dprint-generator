name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: lint · types · unit
    runs-on: ubuntu-latest
    # A few integration tests (db-schema, api-generate, api-generate-3mf) hit a
    # real Postgres — they mirror the local Docker DB. The rest are hermetic.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      AUTH_SECRET: ci-secret-not-used-in-prod
      AUTH_RESEND_KEY: re_ci_dummy
      AUTH_EMAIL_FROM: ci@example.com
      AUTH_ALLOWED_EMAILS: gustavo.b.paris@gmail.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: npx tsc --noEmit
      - run: pnpm db:migrate
      - run: pnpm test:coverage

  e2e:
    name: e2e (built app)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      AUTH_SECRET: ci-e2e-secret-not-used-in-prod
      AUTH_RESEND_KEY: re_ci_dummy
      AUTH_EMAIL_FROM: ci@example.com
      AUTH_ALLOWED_EMAILS: gustavo.b.paris@gmail.com
      # next start serves in production → src/env.ts requires AUTH_URL (Host-injection guard).
      AUTH_URL: http://localhost:3001
      E2E_ALLOW_TEST_LOGIN: '1'
      E2E_BASE_URL: http://localhost:3001
      E2E_TEST_EMAIL: gustavo.b.paris@gmail.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Start app
        run: pnpm start --port 3001 &
      - name: Wait for app
        run: npx wait-on http://localhost:3001 --timeout 60000
      # E2E_BASE_URL is set, so playwright.config.ts skips its webServer and
      # tests the already-started `next start` (the built production app).
      - run: pnpm test:e2e
